; PlatformIO Project Configuration File — Prima3 Pomphuis (pump house /
; irrigation controller)
;
; Board: WEMOS LOLIN S3 Mini (ESP32-S3, dual core, 4 MB Flash, 2 MB PSRAM)
; Partition scheme: Custom OTA (2 x 1.5 MB App / 960 KB SPIFFS)
;
; You do not need PlatformIO to USE the controller: install it from the
; browser (https://777bdvgp.github.io/Prima3-Pomphuis/) and update it from its
; ABOUT page.
;
; To build it yourself:
;   pio run -e usb -t upload        first flash over USB
;   pio run -e ota -t upload --upload-port <controller ip>   later over WiFi
;   (your own upload targets: private.ini, see private.example.ini)
; Every build also writes firmware_out/Prima3_v<ver>.bin (ABOUT page
; upload) and Prima3_v<ver>_full.bin (browser flash of a new board).
;
; WiFi: none built in.  A new controller opens the hotspot "Prima3-Setup";
; connect a phone to it and choose your network.  (Optional built-in
; networks: src/wifi_secrets.example.h.)
;
; Platform pinned by exact URL (pioarduino 53.03.13 = arduino-esp32 3.1.3 /
; IDF 5.3).  Do not change it to a bare "espressif32".

[platformio]
default_envs = usb
extra_configs = private.ini     ; your own upload targets (not committed, see private.example.ini)

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = lolin_s3_mini
framework = arduino
board_build.partitions = partitions_ota.csv
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
extra_scripts =
    post:tools/export_bin.py   ; firmware_out/: Prima3_v<ver>.bin (update) + _full.bin (new board)
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    mathieucarbou/AsyncTCP @ ^3.2.14
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23

; ── USB upload (direct cable) ─────────────────────────────────────────────────
[env:usb]
upload_protocol = esptool
upload_speed = 921600
board_upload.before_reset = default_reset
board_upload.after_reset  = hard_reset

; ── OTA upload (over WiFi) ────────────────────────────────────────────────────
[ota]
upload_protocol = espota
upload_flags = --timeout=30

[env:ota]
extends = ota            ; pio run -e ota -t upload --upload-port <controller ip>
